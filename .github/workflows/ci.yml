name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check:release
      - run: docker compose config --quiet
      - run: docker build --tag xuzhang:ci .
      - name: Smoke test container
        run: |
          docker run --detach --name xuzhang-ci --publish 127.0.0.1:4173:4173 xuzhang:ci
          for i in $(seq 1 30); do
            if curl --fail http://127.0.0.1:4173/healthz; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/healthz
          curl --fail http://127.0.0.1:4173/
          test "$(docker inspect --format '{{.Config.User}}' xuzhang-ci)" = node
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:4173/api/admin/settings)" = 401
          docker rm --force xuzhang-ci
