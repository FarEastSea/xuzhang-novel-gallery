name: diagnose container access
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe existing package access
        run: node scripts/diagnose-ghcr.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
