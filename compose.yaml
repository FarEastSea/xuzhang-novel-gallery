name: xuzhang
services:
  web:
    image: xuzhang:local
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-4173}:4173"
    environment:
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    volumes:
      - xuzhang_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  xuzhang_data:
